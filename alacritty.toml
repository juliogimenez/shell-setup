[env]
TERM = "xterm-256color"

[terminal.shell]
program = "wsl"
args = ["-d", "Ubuntu", "--cd", "~"]

[window]
dimensions = { columns = 120, lines = 30 }
padding = { x = 10, y = 10 }
opacity = 0.96
decorations = "Full"
startup_mode = "Windowed"


[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Light"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[colors.primary]
background = "#2D2A2E"
foreground = "#CDD6F4"

[colors.cursor]
cursor = "#F5E0DC"
text = "#2D2A2E"

[colors.selection]
background = "#5B595C"
text = "#CDD6F4"

[colors.search]
matches = { foreground = "#1E1E2E", background = "#A6E3A1" }
focused_match = { foreground = "#1E1E2E", background = "#FAB387" }

[colors.hints]
start = { background = "#45475A", foreground = "#94E2D5" }
end = { background = "#45475A", foreground = "#A6E3A1" }

[colors.normal]
black = "#313244"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#CBA6F7"
cyan = "#89DCEB"
white = "#CDD6F4"

[colors.bright]
black = "#6C7086"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#89B4FA"
magenta = "#CBA6F7"
cyan = "#89DCEB"
white = "#BAC2DE"

[[colors.indexed_colors]]
index = 16
color = "#FAB387"

[[colors.indexed_colors]]
index = 17
color = "#EBA0AC"

[[colors.indexed_colors]]
index = 18
color = "#94E2D5"

[[colors.indexed_colors]]
index = 19
color = "#B4BEFE"

[[colors.indexed_colors]]
index = 20
color = "#74C7EC"

[[colors.indexed_colors]]
index = 21
color = "#45475A"

[cursor]
style = "Block"
unfocused_hollow = true

[selection]
semantic_escape_chars = ",│`|:\\\"' ()[]{}<>\\t"
save_to_clipboard = false

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "wsl"
args = ["-d", "Ubuntu", "--cd", "~"]

[window]
dimensions = { columns = 120, lines = 30 }
padding = { x = 10, y = 10 }
opacity = 0.96
decorations = "Full"
startup_mode = "Windowed"


[scrolling]
history = 10000
multiplier = 3

[font]
size = 13.0

[font.normal]
family = "IosevkaTerm Nerd Font"
style = "Regular"

[font.bold]
family = "IosevkaTerm Nerd Font"
style = "Bold"

[font.italic]
family = "IosevkaTerm Nerd Font"
style = "Italic"

[font.bold_italic]
family = "IosevkaTerm Nerd Font"
style = "Bold Italic"

[colors.primary]
background = "#16161a"
foreground = "#E4E4E7"

[colors.cursor]
cursor = "#A6E3A1"
text = "#16161a"

[colors.selection]
background = "#3A404B"
text = "#E4E4E7"

[colors.normal]
black = "#18191D"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#7DCFFF"
magenta = "#CBA6F7"
cyan = "#94E2D5"
white = "#dbd7ca"

[colors.bright]
black = "#777777"
red = "#F38BA8"
green = "#A6E3A1"
yellow = "#F9E2AF"
blue = "#7DCFFF"
magenta = "#CBA6F7"
cyan = "#94E2D5"
white = "#ffffff"

[[colors.indexed_colors]]
index = 16
color = "#FAB387"

[[colors.indexed_colors]]
index = 17
color = "#EBA0AC"

[[colors.indexed_colors]]
index = 18
color = "#94E2D5"

[[colors.indexed_colors]]
index = 19
color = "#B4BEFE"

[[colors.indexed_colors]]
index = 20
color = "#74C7EC"

[[colors.indexed_colors]]
index = 21
color = "#45475A"

[cursor]
style = "Block"
unfocused_hollow = true

[selection]
semantic_escape_chars = ",│`|:\\\"' ()[]{}<>\\t"
save_to_clipboard = false

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"
